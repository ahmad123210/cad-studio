# بناء نسخة ويندوز (مثبّت NSIS + نسخة محمولة) على خادم ويندوز من GitHub
# - يدوياً من تبويب Actions (workflow_dispatch)
# - تلقائياً عند دفع وسم إصدار مثل v1.1.0، مع إنشاء مسودة إصدار (Release) مرفق بها الملفان
# - في طلبات الدمج التي تغيّر ملفات Electron أو إعدادات الحزم (للتأكد أن البناء لم ينكسر)
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'electron/**'
      - 'electron-builder.json'
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - '.github/workflows/windows.yml'

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build Windows installer + portable
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cad-studio-windows
          path: |
            dist-electron/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Draft GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist-electron/*.exe \
            --draft --title "CAD Studio ${GITHUB_REF_NAME}" \
            --notes "نسخة ويندوز: ملف Setup للتثبيت، وملف portable للتشغيل دون تثبيت."
