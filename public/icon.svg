<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g stroke="url(#gridGrad)" stroke-width="2">
    <line x1="96" y1="96" x2="416" y2="96" />
    <line x1="96" y1="160" x2="416" y2="160" />
    <line x1="96" y1="224" x2="416" y2="224" />
    <line x1="96" y1="288" x2="416" y2="288" />
    <line x1="96" y1="352" x2="416" y2="352" />
    <line x1="96" y1="416" x2="416" y2="416" />

    <line x1="96" y1="96" x2="96" y2="416" />
    <line x1="160" y1="96" x2="160" y2="416" />
    <line x1="224" y1="96" x2="224" y2="416" />
    <line x1="288" y1="96" x2="288" y2="416" />
    <line x1="352" y1="96" x2="352" y2="416" />
    <line x1="416" y1="96" x2="416" y2="416" />
  </g>

  <!-- Drafting Triangle / Architectural Ruler (مسطرة المثلث الهندسية) -->
  <path d="M 120 392 L 392 392 L 120 120 Z" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="16" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <path d="M 176 348 L 308 348 L 176 216 Z" 
        fill="#0f172a" 
        fill-opacity="0.8" 
        stroke="#7dd3fc" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- Ruler Ticks on the hypotenuse and base -->
  <line x1="160" y1="392" x2="160" y2="376" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <line x1="200" y1="392" x2="200" y2="380" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="240" y1="392" x2="240" y2="374" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <line x1="280" y1="392" x2="280" y2="380" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="320" y1="392" x2="320" y2="374" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <line x1="360" y1="392" x2="360" y2="380" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

  <!-- Compass / Drafting Pointer & Vector Crosshair (بوصلة ومركز التقاط هندسي) -->
  <circle cx="360" cy="152" r="36" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="6" />
  <circle cx="360" cy="152" r="14" fill="#f59e0b" />
  <line x1="360" y1="102" x2="360" y2="202" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="310" y1="152" x2="410" y2="152" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

  <!-- Connecting Engineering Route / Wire -->
  <path d="M 360 188 L 360 260 L 280 260 L 280 348" 
        fill="none" 
        stroke="#f59e0b" 
        stroke-width="7" 
        stroke-dasharray="14,10" 
        stroke-linecap="round" />
</svg>
